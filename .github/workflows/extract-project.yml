name: Extract Project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)

          echo "ZIP file found: $ZIP_FILE"

          mkdir extracted-project
          unzip -o "$ZIP_FILE" -d extracted-project

          shopt -s dotglob
          mv extracted-project/* .
          rm -rf extracted-project
          rm -f "$ZIP_FILE"

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Extract project files from ZIP" || exit 0
          git push
